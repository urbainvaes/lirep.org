# Minimal nginx config for running lirep.org behind one origin.
# Run (from the repository root) with:
#   nginx -p "$PWD/deploy/nginx-run" -c "$PWD/deploy/nginx.conf"
# after `mkdir -p deploy/nginx-run/logs` and `npm run build` in frontend/.
# Edit `root` to the absolute path of frontend/dist.
daemon off;
pid nginx.pid;
error_log logs/error.log;

events {}

http {
    access_log logs/access.log;
    include mime.types;   # in Guix: replace with an absolute path to mime.types
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name _;

        root /ABSOLUTE/PATH/TO/lichess/frontend/dist;

        location /api/  { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location /auth/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

        location / { try_files $uri $uri/ =404; }
    }
}
