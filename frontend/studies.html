<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch (e) {}
    </script>
    <title>Studies · lirep.org</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-title" href="/">
          <span class="site-icon" role="img" aria-label="lirep.org logo"></span>
          <span class="site-name">lirep<span class="tld">.org</span></span>
        </a>
        <nav class="site-nav">
          <a href="/studies.html" aria-current="page">Studies</a>
          <a href="/stats.html">Stats</a>
          <a href="/practice.html">Practice</a>
          <a href="/community.html">Community</a>
          <a href="/doc/index.html">Doc</a>
          <a href="/about.html">About</a>
        </nav>
        <div class="site-auth" id="auth-area">
          <a class="btn btn-primary" href="/auth/login">Sign in</a>
        </div>
      </div>
    </header>

    <main class="site-main">
      <div id="studies-grid">
        <div class="empty-state">
          <p>Loading studies…</p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/studies.ts"></script>
  </body>
</html>
